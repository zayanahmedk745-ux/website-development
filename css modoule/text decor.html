<!DOCTYPE html>
<html>
    <head>
        <style>
            h1{
                text-decoration: overline;
                text-transform: capitalize;
            }
            h2{
                text-decoration: line-through;
                text-transform: uppercase;
            }
            h3 {
                text-decoration: underline;
                text-transform: lowercase;
            }
            h4 {text-decoration: underline overline;
             text-transform:none;
        }
  
        </style>
    </head>
    <body>
     <h1>codignal<h1>
     <h2>coDignal</h2>
     <h3>coDignal</h3>
     <h4>coDignal</h4>      
     </body>
     </html>
